title: Palak Paneer - Revised
content_type: RecipePost
date: 2021-11-17
---

This is a revised version of my original recipe, that is slower to cook, but (I
feel) yields a tastier result.

## Serves: 6

## Ingredients

- 500g frozen chopped spinach
- 500g paneer, diced ~1cm cubes
- 1 cup water
- 2 tbsp ghee (alt: olive oil)
- 1 onion, diced finely
- 1 can diced / crushed tomatoes (~400g)
- 1 tbsp garlic &amp; ginger paste
- 1 tsp Kashmiri red chilli powder
- 1 tsp coriander powder
- 1 tsp sweet smoked paprika
- 1 tsp garam masala
- 1 tbsp kasuri methi

## Steps

1. microwave spinach for 10 minutes (ref: 1000W microwave)
1. blend with water and garam masala into a fine paste
1. in a 24cm saut&eacute; pan on low heat, melt ghee
1. add onion; saut&eacute; until starting to brown
1. stir through garlic &amp; ginger paste; saut&eacute; 20 - 30 seconds
1. add chilli powder, coriander, and paprika; stir and saut&eacute; until fragrant; 10 to 30 seconds
1. add tomato; stir and saut&eacute; until it breaks down into a paste with the onion and spices;
1. add spinach and water; simmer covered for 5 minutes, stirring regularly; look for it to change to khaki colour
1. add kasuri methi and paneer; stir through, season to taste, simmer covered 5 minutes

Serve on steamed basmati rice!
